name: AegirDemo
options:
  bundleIdPrefix: studio.molly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AegirDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: Aegir
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Your location is used to display your position on the globe.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.molly.AegirDemo
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/Sources
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MTL_FAST_MATH: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
